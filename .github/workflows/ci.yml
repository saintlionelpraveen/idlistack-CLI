name: CI — Build & Test

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Go Build, Vet & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build IdliStack CLI Binary
        run: |
          make build
          ./bin/idlistack version
          ./bin/idlistack --help

      - name: Validate Installer Script Syntax
        run: bash -n install.sh
