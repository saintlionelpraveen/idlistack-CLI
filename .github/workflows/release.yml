name: Release — Multi-Platform Binaries & VSIX

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.9.0)"
        required: true
        default: "v1.9.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Determine Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: go test ./... -v

      - name: Cross-Compile Multi-Platform Binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/idlistack/cli/cmd.Version=${VERSION}"

          for TARGET in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            GOOS="${TARGET%/*}"
            GOARCH="${TARGET#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

            OUT_BIN="dist/idlistack_${VERSION}_${GOOS}_${GOARCH}${EXT}"
            echo "Building ${OUT_BIN}..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -ldflags "$LDFLAGS" -o "$OUT_BIN" .
          done

          # Copy installer and latest VS Code VSIX package if present
          cp install.sh dist/install.sh
          cp vscode-extension/*.vsix dist/ 2>/dev/null || true

          # Generate SHA-256 Checksums
          cd dist
          sha256sum idlistack_* install.sh *.vsix 2>/dev/null > checksums.txt || sha256sum idlistack_* install.sh > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "IdliStack CLI ${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          files: |
            dist/idlistack_*
            dist/install.sh
            dist/*.vsix
            dist/checksums.txt
          body: |
            ## 🚀 IdliStack CLI ${{ steps.version.outputs.VERSION }}

            Deploy any application to Kubernetes (**K3s**, **Minikube**, **Kind**) with zero configuration — powered by **Go**, **Railpack (BuildKit)**, **Helm v3**, and **Keycloak OIDC + K3s RBAC**.

            ### ⚡ One-Line Install / Upgrade
            ```bash
            curl -fsSL https://raw.githubusercontent.com/saintlionelpraveen/Idlistack-CLI/main/install.sh | bash
            ```

            ### 📦 Included Release Assets
            - `idlistack_*_linux_amd64` / `linux_arm64` — Linux CLI Binaries
            - `idlistack_*_darwin_amd64` / `darwin_arm64` — macOS (Intel & Apple Silicon) Binaries
            - `idlistack_*_windows_amd64.exe` — Windows CLI Binary
            - `idlistack-vscode-*.vsix` — Official VS Code Extension Package
            - `install.sh` — Automated Multi-Distro Prerequisites & K3s Installer
            - `checksums.txt` — SHA-256 Checksums
